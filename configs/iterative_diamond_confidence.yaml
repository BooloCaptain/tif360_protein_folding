phase: 1
seed: 42
device: cuda

data:
  split: train
  max_len: 200
  max_len_valid: 200
  max_len_test: 2048
  subset_size_valid: 100
  subset_size_test: 100
  use_sidechainnet_if_available: true
  dynamic_batching: true

model:
  vocab_size: 33
  d_model: 256
  nhead: 8
  num_layers: 6
  dim_feedforward: 1024
  dropout: 0.1
  max_len: 4096
  head_hidden: 128
  d_pair: 128
  arch_override: iterative_diamond_confidence_network

training:
  resume_from_checkpoint: true
  max_tokens: 2500
  accumulation_steps: 8
  megabatch_size: 10000
  lr: 5e-4
  min_lr_ratio: 0.01
  total_steps: 10000
  warmup_steps: 1000
  decay_steps: 10000
  logging_interval: 100
  checkpoint_interval: 500
  checkpoint_path: checkpoints/iterative_diamond_confidence.pt
  compile: false

loss:        
  lambda_geom: 0.1
  lambda_disto: 0.2
  lambda_3d_local: 1.0

inference:
  max_tokens: 2500
  checkpoint_path: checkpoints/iterative_diamond_confidence.pt

postproc:
  use_nerf: true
  nerf_impl: mpnerf

export:
  output_dir: outputs/iterative_diamond_confidence
  pdb: true
  gltf: true
